<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Abschlusstest Simulator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: eine Frage pro Seite wie auf der Lernplattform: weiße Karte, grüner Fortschrittsbalken, runder grüner Weiter-Button */
:root{--bg:#f4f5f7;--card:#ffffff;--card2:#f1f8f6;--ink:#1c1e22;--mut:#69707d;--line:#e4e6eb;--opt:#ffffff;--chip:#eceef3;--chipink:#2b2f3a;--accent:#2f8b7b;--accentink:#ffffff;--ok:#1d8a4a;--bad:#c23a2c;--okbg:#e4f4eb;--badbg:#fbe8e5;--track:#dde1e6;--shadow:0 1px 2px rgba(20,24,30,.06),0 6px 22px rgba(20,24,30,.07);
--sans:Arial,"Liberation Sans",Helvetica,sans-serif;--fa:Vazirmatn,"Segoe UI",Tahoma,"Noto Naskh Arabic",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13161a;--card:#1c2025;--card2:#18211f;--ink:#e9ebef;--mut:#9aa2af;--line:#2d333b;--opt:#20252b;--chip:#2a3038;--chipink:#dfe3ea;--accent:#4cb8a5;--accentink:#08201b;--ok:#55c47f;--bad:#ff7d70;--okbg:#17301f;--badbg:#3b201d;--track:#2a3138;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 22px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13161a;--card:#1c2025;--card2:#18211f;--ink:#e9ebef;--mut:#9aa2af;--line:#2d333b;--opt:#20252b;--chip:#2a3038;--chipink:#dfe3ea;--accent:#4cb8a5;--accentink:#08201b;--ok:#55c47f;--bad:#ff7d70;--okbg:#17301f;--badbg:#3b201d;--track:#2a3138;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 22px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.chip:focus-visible,.slot:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--card);border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.prog{flex:1;min-width:200px;max-width:380px}
.prog .t{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);display:flex;gap:8px;align-items:baseline}
.prog .t span{font-weight:400;letter-spacing:.02em;text-transform:none;color:var(--mut)}
.track{height:4px;border-radius:4px;background:var(--track);margin-top:5px;overflow:hidden}.track i{display:block;height:100%;background:var(--accent);transition:width .25s}
.brand{font-weight:700;letter-spacing:.04em;flex:1}
.tools{display:flex;gap:12px;align-items:center;margin-inline-start:auto}
#timer{font-variant-numeric:tabular-nums;font-weight:700;min-width:54px;text-align:right}
.sw{display:flex;gap:8px;align-items:center;font:500 13px var(--fa);background:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 6px}
.sw i{width:30px;height:16px;border-radius:9px;background:var(--track);position:relative;transition:background .2s}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--card);transition:transform .2s}
.sw[aria-pressed=true] i{background:var(--accent)}.sw[aria-pressed=true] i::after{transform:translateX(14px)}
main{max-width:760px;margin:22px auto 0}
.card{background:var(--card);border-radius:10px;box-shadow:var(--shadow);padding:30px 32px 26px}
.card.even{background:var(--card2)}
.qn{margin:0 0 22px;font-size:12px;font-weight:700;letter-spacing:.3em}
.qt{font-size:17px;line-height:1.5;margin-bottom:6px}
.fa{display:none;direction:rtl;text-align:right;font:400 13.5px/1.8 var(--fa);color:var(--mut);margin-top:3px}
body.showfa .fa{display:block}
.qt+.fa{margin-bottom:10px}
.chip,.grip,#ord .row{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.grip{padding:8px 10px;margin:-8px -4px;font-size:16px}.chip{padding-block:12px}.ghost{border-radius:6px}.row.over{outline:2px solid var(--accent)}
.hint{display:none}body.showans .hint{display:block}body.showans b.hint{display:inline-block}
b.hint{background:var(--ok);color:#fff;border-radius:999px;min-width:22px;height:22px;line-height:22px;text-align:center;font-size:12px}
body.showans .opt.hintok{background:var(--okbg)!important;border-color:var(--ok)!important}
body.showans .opt.hintok .ot::after{content:" ✔";color:var(--ok);font-weight:700}
.hint.corr{padding:0 14px 8px;font-size:12.5px;color:var(--ok)}
.rev .hint{display:none!important}
.pic{display:block;max-width:100%;max-height:360px;margin:14px auto;border-radius:6px;background:#fff}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:15px 16px;background:var(--opt);border:1px solid var(--line);border-radius:6px;font-size:13.5px;font-weight:500}
.opt:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.box{flex:none;width:13px;height:13px;margin-top:3px;border:1.5px solid var(--mut);border-radius:3px;display:grid;place-items:center}
.opt.on{border-color:var(--accent)}.opt.on .box{background:var(--accent);border-color:var(--accent)}
.opt.on .box::after{content:"";width:3px;height:7px;border:solid var(--accentink);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.ot{min-width:0;flex:1;overflow-wrap:anywhere}
.row{display:flex;gap:12px;align-items:center;padding:10px 12px;background:var(--opt);border:1px solid var(--line);border-radius:6px;font-size:13.5px;font-weight:500}
.grip{color:var(--mut);cursor:grab;user-select:none}
.arr{display:grid;gap:2px;flex:none}.arr button{border:1px solid var(--line);background:var(--chip);border-radius:4px;line-height:1;padding:3px 7px;font-size:10px}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:44px;margin:18px 0 12px;padding:10px;border:1px dashed var(--line);border-radius:8px}
.chip{display:inline-flex;gap:8px;align-items:center;background:var(--chip);color:var(--chipink);border:0;border-radius:5px;padding:9px 12px;font-size:13px;font-weight:500;cursor:grab;text-align:left}
.chip.sel{outline:2px solid var(--accent)}
.mrow{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:6px;background:var(--opt);overflow:hidden}
.mrow .ml{padding:12px 14px;font-size:13.5px;font-weight:500;border-right:1px solid var(--line);min-width:0;overflow-wrap:anywhere}
.slot{min-height:46px;padding:6px 8px;display:flex;align-items:center;cursor:pointer;background:transparent;border:0;width:100%;text-align:left}
.slot.over{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.slot .chip{cursor:pointer}
.nav{display:flex;gap:12px;align-items:center;justify-content:flex-end;margin-top:26px;flex-wrap:wrap}
.warn{margin-right:auto;font-size:13px;color:var(--bad)}
.go{background:var(--accent);color:var(--accentink);border:0;border-radius:999px;padding:9px 22px;font-size:12px;font-weight:700;letter-spacing:.03em}
.go:hover{filter:brightness(1.08)}
.lnk{background:none;border:0;color:var(--mut);font-size:13px;padding:8px 4px}
.lnk:disabled{opacity:.35;cursor:default}
.dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:18px}
.dots button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:11px;font-variant-numeric:tabular-nums}
.dots .done{background:color-mix(in srgb,var(--accent) 22%,var(--card));border-color:var(--accent)}
.dots .cur{outline:2px solid var(--accent)}
.start{text-align:center}.start h1{margin:0 0 8px;font-size:22px}.start p{margin:6px 0;color:var(--mut)}
.start .go{margin-top:18px;padding:12px 34px;font-size:14px}
.fa-block{direction:rtl;text-align:right;font-family:var(--fa)}
.fa-block h3{margin:0 0 10px;font-size:16px}
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:14px}
td,th{border-bottom:1px solid var(--line);padding:7px 8px;text-align:right}th{color:var(--mut);font-weight:500}
.scroll{overflow-x:auto}
.ver{flex:none;font-size:11px;color:var(--mut);direction:ltr;align-self:flex-start;margin-top:-2px}
.savebar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13.5px;margin:0 0 12px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--opt)}
.chart{display:block;width:100%;height:auto;margin:10px 0;color:var(--mut)}
.res{text-align:center}.big{font-size:56px;font-weight:700;line-height:1.1}.big.p{color:var(--ok)}.big.f{color:var(--bad)}
.rev{display:grid;gap:14px;margin-top:20px}
.rev .card{padding:22px 24px}
.rev .tag{float:right;font-size:12px;font-weight:700;letter-spacing:.06em}.tag.y{color:var(--ok)}.tag.n{color:var(--bad)}
.rev .opt,.rev .row,.rev .mrow{pointer-events:none}
.okm{background:var(--okbg)!important;border-color:var(--ok)!important}.badm{background:var(--badbg)!important;border-color:var(--bad)!important}
.corr{font-size:12.5px;color:var(--ok);padding:0 14px 8px}
.mrow .corr{grid-column:1/-1;padding:0 14px 8px}
@media (max-width:560px){.card{padding:22px 16px 18px}.mrow{grid-template-columns:1fr}.mrow .ml{border-right:0;border-bottom:1px solid var(--line)}.prog{max-width:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>
<header id="hd"></header>
<main id="app"></main>

const BANK=[{"n":1,"code":"G","de":"Welche Aussagen zur Kommunikation treffen zu?","fa":"کدام جمله‌ها درباره‌ی ارتباط درست‌اند؟","ok":["Die nonverbale Kommunikation übernimmt 55 % des Anteils der Kommunikation.","Verbale Kommunikation ist der sprachliche Teil der Kommunikation.","Der Appell, die Beziehung, die Selbstoffenbarung und der Sachinhalt sind die vier Seiten einer Nachricht."],"bad":["Nonverbale Kommunikation ist die Art, wie der Sender kommuniziert.","Der Sender und der Empfänger müssen auf unterschiedliche Weise codieren und decodieren, damit die Nachricht voll und ganz verstanden werden kann."],"tip":"موضوع: ارتباط (Kommunikation). روش حل: دو عدد/فهرست را حفظ کن: ارتباط غیرکلامی ۵۵٪، و چهار روی پیام (Appell، Beziehung، Selbstoffenbarung، Sachinhalt).","count":8,"stars":5,"img":null},{"n":2,"code":"H","de":"Auf welche Medikamentengruppe greift man bei folgenden Beschwerden zurück? (Schmerzen; Unruhe; Bluthochdruck; Bauchkrämpfe; Obstipation)","fa":"برای کدام مشکلات به کدام گروه دارویی روی می‌آوریم؟","ok":["Bluthochdruck = Antihypertonika","Unruhe = Sedativa","Schmerzen = Analgetika","Obstipation = Laxanzien","Bauchkrämpfe = Spasmolytika"],"bad":[],"tip":"موضوع: گروه‌های دارویی. روش حل: از ریشه‌ی نام بفهم: Analgetika = درد، Sedativa = بی‌قراری، Antihypertonika = فشار خون، Spasmolytika = گرفتگی شکم، Laxanzien = یبوست.","count":8,"stars":5,"img":null},{"n":3,"code":"AV","de":"Welche Aussagen zu Notfällen treffen zu?","fa":"کدام جمله‌ها درباره‌ی اورژانس‌ها درست‌اند؟","ok":["Man unterteilt Notfälle in allgemeine und medizinische Notfälle.","Intoxikation nach Einnahme von Medikamenten, Giften oder Gas zählt zu den reversiblen Ursachen, die eine Reanimation erfordern können.","Als medizinischer Notfall werden im Gesundheitswesen Fälle benannt, bei denen es zu einer lebensbedrohlichen Störung der Vitalparameter oder der Funktionskreisläufe kommt."],"bad":["Ein Wasserrohrbruch zählt nicht zu den allgemeinen Notfällen.","Hyperglykämie zählt nicht zu den reversiblen ندن رابطه» و «mitleiden» غلط‌اند.","count":7,"stars":5,"img":null},{"n":7,"code":"E","de":"Welche Aussagen zur Evaluation im Dokumentationsprozess sind richtig?","fa":"کدام جمله‌ها درباره‌ی ارزیابی در فرایند مستندسازی درست‌اند؟","ok":["Wird bei der Zielkontrolle festgestellt, dass das Ziel erreicht wurde, wird dies im Pflegebericht dokumentiert.","Wird das Ziel verfehlt, wird es angepasst.","Das Instrument der Pflegevisite dient in besonderem Maße der Beurteilung der Wirkung der Pflege.","Auch Berichte von externen Therapeuten werden evaluiert."],"bad":["Wird das Ziel verfehlt, wird dies auch nicht im Pflegebericht dokumentiert."],"tip":"موضوع: ارزیابی (Evaluation) در فرایند مستندسازی. روش حل: هر جمله که ثبت، تعدیل یا ارزیابی را می‌گوید درست است. تنها جمله‌ی غلط «عدم ثبت» هدف محقق‌نشده است.","count":6,"stars":5,"img":null},{"n":8,"code":"F","de":"Welche Aussagen zu den verschiedenen Verfügungen sind richtig?","fa":"کدام جمله‌ها درباره‌ی انواع Verfügung درست‌اند؟","ok":["Die Vorsorgevollmacht erteilt einer Person die Vollmacht, im Notfall alle oder bestimmte Aufgaben zu erledigen.","Betreuungsverfügung erteilt Mitspracherecht, wer vom Vormundschaftsgericht als Betreuer bestellt wird.","Die Patientenverfügung ist die Anweisung, bestimmte medizinische Behandlungen vorzunehmen oder zu unterlassen."],"bad":["Es gibt insgesamt 2 Vorsorgeverfügungen.","Die Patientenverfügung erteilt einer Person die Vollmacht, im Notfall alle oder bestimmte Aufgaben zu erledigen."],"tip":"موضوع: سه نوع Verfügung. روش حل: Vorsorgevollmacht = وکالت، Betreuungsverfügung = حق نظر در انتخاب سرپرست، Patientenverfügung = دستور درمان. «فقط ۲ نوع» و جابه‌جا کردن تعریف‌ها غلط است.","count":6,"stars":5,"img":null},{"n":9,"code":"K","de":"Fülle die Lücken mit den fehlenden Wörtern. Das [1] Nervensystem besteht aus Gehirn und [2]. Zum [3] Nervensystem gehört das [4] und vegetative Nervensystem. Das zentrale und das periphere Nervensystem sind miteinander [5].","fa":"جاهای خالی را پر کن.","ok":["1 = zentrale","2 = Rückenmark","3 = peripheren","4 = somatische","5 = verflochten"],"bad":[],"tip":"موضوع: ساختار سیستم عصبی. روش حل: مرکزی (zentrale) = مغز + نخاع. محیطی (peripheren) شامل سیستم پیکری (somatische) و خودکار است، و این دو با هم در هم تنیده (verflochten) هستند.","count":6,"stars":5,"img":null},{"n":10,"code":"M","de":"Welche Aussagen zur Sauerstoffflasche sind richtig?","fa":"کدام جمله‌ها درباره‌ی کپسول اکسیژن درست‌اند؟","ok":["Der große Nachteil ist, dass sie häufig nachgefüllt werden müssen.","Ein Vorteil ist, dass die Notwendigkeit einer Stromquelle entfällt.","Das Manometer einer 10-l-Sauerstoffflasche zeigt 100 bar. Das bedeutet einen Restsauerstoff von 1000 barl."],"bad":["Ein anderer Nachteil ist die Geräuschbelästigung.","Die Sauerstoffflasche ist nicht für den Transport geeignet."],"tip":"موضوع: کپسول اکسیژن. روش حل: ۱۰ لیتر × ۱۰۰ بار = ۱۰۰۰ لیتر. عیب: پر کردن مکرر؛ مزیت: بی‌نیاز از برق. «سر و صدا» و «غیرقابل حمل» غلط‌اند.","count":6,"stars":5,"img":null},{"n":11,"code":"O","de":"Welche Aussagen zur basalen Stimulation treffen zu?","fa":"کدام جمله‌ها درباره‌ی تحریک پایه (Basale Stimulation) درست‌اند؟","ok":["Beim Ausbleiben der Reize spricht man von sensorischer Deprivation.","Basale Stimulation ist mehr ein pädagogisches Konzept als eine Therapiemaßnahme.","Pflegeabläufe richten sich nach dem Patienten."],"bad":["Basale Stimulation dient rein der Verbesserung der Bewegung.","Basale Stimulation richtet sich nicht an Menschen \"ohne Bewusstsein\"."],"tip":"موضوع: تحریک پایه (Basale Stimulation). روش حل: غلط‌ها: «فقط بهبود حرکت» و «برای افراد بدون هوشیاری نیست». ریشه‌ی درست: نبود تحریک = محرومیت حسی.","count":6,"stars":5,"img":null},{"n":12,"code":"R","de":"Sortiere den Weg der Atemluft bei der Exspiration durch die Bronchien.","fa":"مسیر هوای بازدم را از میان برونش‌ها مرتب کن.","ok":["1. Bronchioli respiratorii","2. Bronchiolen","3. Bronchioli terminalis","4. Lappenbronchien","5. Stammbronchus"],"bad":[],"tip":"موضوع: مسیر هوا در بازدم. روش حل: از عمق ریه به بیرون: Bronchioli respiratorii، Bronchiolen، Bronchioli terminalis، Lappenbronchien، Stammbronchus.","count":6,"stars":5,"img":null},{"n":13,"code":"U","de":"Welche der folgenden Notfallsituationen gehören zu den typischen Notfallsituationen im pflegerischen Alltag?","fa":"کدام موقعیت‌ها جزو اورژانس‌های معمول در مراقبت روزمره‌اند؟","ok":["Dekanülierung","Diabetische Entgleisung","Herz-/Kreislaufstillstand, Apnoe","Sturz","Atemnot und Aspiration"],"bad":[],"tip":"موضوع: اورژانس‌های رایج پرستاری. روش حل: هر ۵ گزینه درست است، همه را تیک بزن.","count":6,"stars":5,"img":null},{"n":14,"code":"V","de":"Bei der Ernährung muss der Energiebedarf oft den wechselnden Situationen angepasst werden. Welche Formeln und Faktoren der Berechnungen sind richtig?","fa":"کدام فرمول‌ها و ضریب‌های محاسبه‌ی نیاز انرژی درست‌اند؟","ok":["Berechnung des Grundumsatzes bei Frauen laut WHO und MDS: (0,0377 x Gewicht in kg + 2,75) x 239 = 1288 kcal","Bei schwerem Stress wird der Grundumsatz um den Faktor 1,6 erhöht","Bei einem Polytrauma mit einer Sepsis handelt es sich um einen Traumafaktor von 1,6","Berechnung des Grundumsatzes bei Menschen laut DGEM: 20–30 Jahre: 25 kcal x Gewicht in kg","Die Berechnung des Energiebedarfs von Intensivpatienten erfolgt nach Long durch Grundumsatz x Aktivitätsfaktor x Traumafaktor x Temperaturfaktor (GU x AF x VF x TF)"],"bad":[],"tip":"موضوع: محاسبه‌ی نیاز انرژی. روش حل: هر ۵ گزینه درست است. اعداد را حفظ کن: ضریب ۱٫۶ برای استرس شدید و پلی‌تروما، ۲۵ kcal/kg برای ۲۰ تا ۳۰ سال، و فرمول Long: GU × AF × VF × TF.","count":6,"stars":5,"img":null},{"n":15,"code":"X","de":"Welche Aussagen zum Rückenmark des ZNS treffen zu?","fa":"کدام جمله‌ها درباره‌ی نخاع درست‌اند؟","ok":["Die Nerven von Cortex zum Rückenmark werden als „Erstes Motoneuron“ bezeichnet.","Das Spinalganglion stellt eine Ansammlung von Nervenzellkörpern jener Neuronen dar, die über sensible Nervenfasern afferente Signale zum Hinterhorn des Rückenmarks führen.","Im Vorderhorn des Rückenmarks werden die vom Cortex ankommenden Impulse auf das „Zweite Motoneuron“ weitergeleitet."],"bad":["Das Spinalganglion (Ganglion spinale) ist ein noch innerhalb des Wirbelkanals gelegener Nervenknoten (Ganglion) von Nervenzellen des zentralen Nervensystems.","Die Nerven von Cortex zum Rückenmark werden als „Zweites Motoneuron“ bezeichnet."],"tip":"موضوع: نخاع. روش حل: قشر مغز به نخاع = نورون حرکتی اول. Spinalganglion = جسم سلولی نورون‌های حسی به سمت شاخ پشتی. در شاخ قدامی تکانه به نورون حرکتی دوم می‌رود.","count":6,"stars":5,"img":null},{"n":16,"code":"AF","de":"Welche Aussagen zu Recht und Delegation sind korrekt?","fa":"کدام جمله‌ها درباره‌ی حقوق و واگذاری (Delegation) درست‌اند؟","ok":["Die Rechtswidrigkeit kann entfallen, wenn die Handlung aus Notwehr entstand.","Der Eingriff in den menschlichen Körper ist vom Arzt nicht delegierbar.","Die fachpflegerischen Tätigkeiten richten sich nach der Ausbildung bzw. Fachweiterbildung."],"bad":["Freiheitsstrafe zählt zu den zivilrechtlichen Konsequenzen.","Das Anlegen eines Gipsverbandes ist vom Arzt nicht delegierbar."],"tip":"موضوع: حقوق و واگذاری وظایف. روش حل: درست: دفاع مشروع، مداخله در بدن را پزشک واگذار نمی‌کند، وظایف تخصصی طبق آموزش. غلط: حبس = پیامد مدنی، گچ‌گیری غیرقابل واگذاری.","count":6,"stars":5,"img":null},{"n":17,"code":"AN","de":"Welche der folgenden Materialien gehören zu den sogenannten Einwegmaterialien und werden nach dem Gebrauch entsorgt bzw. durch neue ersetzt?","fa":"کدام مواد یک‌بارمصرف‌اند؟","ok":["Absaugkatheter","Klimatisierungsfilter","Fixierungsbänder für die Trachealkanüle"],"bad":["Luftröhrenspreizer","Trachealkanülen"],"tip":"موضوع: مواد یک‌بارمصرف. روش حل: Absaugkatheter، Klimatisierungsfilter و Fixierungsbänder یک‌بارمصرف‌اند؛ Luftröhrenspreizer و Trachealkanülen نه.","count":6,"stars":5,"img":null},{"n":18,"code":"BA","de":"Worauf könnten die folgenden Atemgeräusche hinweisen? Ordne richtig zu.","fa":"صداهای تنفسی زیر به چه چیزی اشاره دارند؟","ok":["Pleurareiben, ein Geräusch wie Knarren von Leder = Pleuritis","Fauchende Atemgeräusche = Pneumonie","Leises, rauschendes Atemgeräusch, säuselnd = Normal","Abgeschwächte oder fehlende Atemgeräusche = Atelektasen","Neben- oder Rasselgeräusche = Vermehrte Sekretansammlung"],"bad":[],"tip":"موضوع: صداهای تنفسی. روش حل: Pleurareiben = Pleuritis، فوت‌مانند = Pneumonie، نرم و آرام = Normal، ضعیف یا ناپدید = Atelektasen، خرخر = تجمع ترشح.","count":6,"stars":5,"img":null},{"n":19,"code":"B","de":"Welche Aussagen zu den Sekreten am Tracheostoma und die Pflege des Tracheostomas treffen zu?","fa":"کدام جمله‌ها درباره‌ی ترشحات و مراقبت از تراکئوستومی درست‌اند؟","ok":["Das Sekret am Tracheostoma besteht zu Teilen aus Trachealsekret, Mageninhalt und Speichel und Sekret aus dem naso- und oropharyngealen Bereich.","Der Verband sollte 2–3 Mal täglich gewechselt werden.","Nach 2–4 Wochen ist ein aseptischer Verbandswechsel nicht mehr erforderlich."],"bad":["Nach einer Woche ist ein aseptischer Verbandswechsel nicht mehr erforderlich.","Bei Entzündungen 0,9%ige NaCl-Lösung verwenden."],"tip":"موضوع: ترشح و پانسمان تراکئوستومی. روش حل: عددها را حفظ کن: پانسمان ۲ تا ۳ بار در روز، و بعد از ۲ تا ۴ هفته (نه یک هفته) تعویض آسپتیک لازم نیست. گزینه‌ی NaCl ۰٫۹٪ غلط است.","count":5,"stars":4,"img":null},{"n":20,"code":"I","de":"Welche Aussagen zu den Grundparametern der Beatmung sind richtig?","fa":"کدام جمله‌ها درباره‌ی پارامترهای پایه‌ی تهویه درست‌اند؟","ok":["Schäden in der Lunge, die durch zu hohe Drücke hervorgerufen werden, nennt man Barotrauma.","PIN ist der Inspirationsdruck.","Schäden, die durch zu hohe Atemzugsvolumina hervorgerufen werden, nennt man Volumentrauma."],"bad":["Beim Lungenemphysem tritt ein Verhältnis von Inspiration zu Exspiration (I:E) von 1:3 auf.","PEEP ist der Inspirationsdruck."],"tip":"موضوع: پارامترهای پایه‌ی تهویه. روش حل: Barotrauma = فشار زیاد و Volumentrauma = حجم زیاد. جمله‌های «I:E = 1:3 در آمفیزم» و «PEEP = فشار دمی» غلط‌اند (PEEP فشار پایان بازدم است).","count":5,"stars":4,"img":null},{"n":21,"code":"J"," schwindigkeit steigt zu Beginn und fällt dann ab = Sinus","Verwirbelungen/Querströmungen = Turbulent"],"bad":[],"tip":"موضوع: انواع Flow. روش حل: هر نوع را با شکلش تطبیق بده: akzelerierend = دائم بالا می‌رود، dezelerierend = اول بالا بعد کم، laminar = بدون اغتشاش، Sinus، turbulent = گرداب.","count":4,"stars":3,"img":null},{"n":44,"code":"AW","de":"Welche Aussagen zu den Beatmungskonzepten/Beatmungsmodi sind falsch?","fa":"کدام جمله‌ها درباره‌ی مدل‌های تهویه نادرست‌اند؟","ok":["PSV ist volumenorientiert.","Das klinische Menü am Gerät ist frei zugänglich."],"bad":["Alarmgrenzen werden individuell angepasst.","VCV ist volumenorientiert.","Die Einstellung der Alarmfunktion erfolgt im Beatmungszentrum."],"tip":"موضوع: حالت‌های تهویه (جمله‌های غلط). روش حل: غلط‌ها: «PSV حجم‌محور است» (PSV فشارمحور است) و «منوی بالینی دستگاه آزادانه در دسترس است».","count":4,"stars":3,"img":null},{"n":45,"code":"AY","de":"Welche der folgenden Aussagen zur Hygiene sind falsch?","fa":"کدام جمله‌ها درباره‌ی بهداشت نادرست‌اند؟","ok":["Hygiene ist die Reinigung und Sterilisation von Flächen, Händen, der PSA etc.","Bei der Sterilisation findet eine Keimreduktion um 100 % statt."],"bad":["Eine 100-prozentige Keimreduktion ist nicht möglich.","Bei der Reinigung gibt es eine Keimreduktion um ca. 80 %.","Hygiene hat das Ziel, Erkrankungen zu vermeiden und der Gesunderhaltung des Menschen und der Umwelt zu dienen."],"tip":"موضوع: بهداشت (جمله‌های غلط). روش حل: غلط‌ها: «Hygiene = Reinigung و Sterilisation» و «Sterilisation میکروب را ۱۰۰٪ کم می‌کند».","count":4,"stars":3,"img":null},{"n":46,"code":"BC","de":"Welche Aussagen zum Richten von Medikamenten sind richtig?","fa":"کدام جمله‌ها درباره‌ی آماده‌کردن دارو درست‌اند؟","ok":["Pflegekräfte stellen die Medikation für den Kunden und den Tag zusammen.","Apotheken liefern fertig geblisterte Tagesdosetten.","Flüssige Medikamente unmittelbar vor der Gabe zubereiten."],"bad":["Flüssige Medikamente ungefähr 24 Stunden vor der Gabe zubereiten.","Medikamente in kation von Medikamenten, da diese diffus im Raum verteilt werden."],"bad":["Beim Düsenvernebler entstehen besonders kleine Tröpfchen, die direkt in der Lunge deponiert werden.","Die Ultraschallvernebler sind sehr laut durch den Kompressor."],"tip":"موضوع: انواع نبولایزر. روش حل: Düsenvernebler جریان دائم و فعال با تنفس؛ Membranvernebler از میکرو‌نازل؛ Ultraschallvernebler برای دارو مناسب نیست. دو جمله‌ی «قطره‌ی ریز مستقیم» و «سر و صدا از کمپرسور» غلط‌اند.","count":3,"stars":2,"img":null},{"n":53,"code":"AL","de":"Welche Aussagen zum Überleitungs- und Entlassungsmanagement treffen zu?","fa":"کدام جمله‌ها درباره‌ی مدیریت انتقال و ترخیص درست‌اند؟","ok":["Die Entlassung ist auch ein Einschnitt in das Leben der Angehörigen.","Überleitungsmanagement ist eine systematische, individuell abgestimmte Maßnahmen, um die Verlegungen aus einer Einrichtung in eine andere zu organisieren."],"bad":["Eine Grundidee ist es, die primäre Kontaktperson mit einzubeziehen.","Die Zuständigkeit liegt beim sozialen Dienst.","Die Entlassungsplanung nimmt in der Regel nur ein paar Tage in Anspruch."],"tip":"موضوع: ترخیص و انتقال بیمار. روش حل: ترخیص برای بستگان هم یک نقطه‌ی عطف است؛ Überleitungsmanagement یعنی اقدامات منظم و هماهنگ برای انتقال.","count":3,"stars":2,"img":null},{"n":54,"code":"AU","de":"Fülle die Lücken der Glasgow-Koma-Skala.","fa":"جاهای خالی مقیاس کمای گلاسکو را پر کن.","ok":["6 Punkte, Motorische Reaktion = Befolgt Aufforderung","4 Punkte, Augen Öffnen = Spontan","4 Punkte, Motorische Reaktion = Ungezielte Schmerzabwehr","2 Punkte, Verbale Kommunikation = Unverständliche Worte","1 Punkt, Augen Öffnen = Keine Reaktion"],"bad":[],"tip":"موضوع: مقیاس کمای گلاسگو. روش حل: پاسخ‌ها را از «بهترین» (اطاعت از دستور) تا «بدترین» (بدون واکنش) مرتب کن و با ردیف‌های جدول تطبیق بده.","count":3,"stars":2,"img":null},{"n":55,"code":"BB","de":"Welche Aussagen zur Dysphagie treffen zu?","fa":"کدام جمله‌ها درباره‌ی دیسفاژی (اختلال بلع) درست‌اند؟","ok":["Die Pressbyphagie ist eine altersbedingte Schluckstörung.","Ösophageale Dysphagie ist die Schluckstörung in Form von Passagebehinderung.","Bei der Aphagie ist das Schlucken gar nicht mehr möglich.","Aus der Dysphagie kann sich als Folge eine Aspirationspneumonie entwickeln."],"bad":["Odinophagie ist die Schluckstörung in Form von Passagebehinderung."],"tip":"موضوع: اختلال بلع (Dysphagie). روش حل: Presbyphagie = مرتبط با سن، ösophageale Dysphagie = مانع عبور، Aphagie = بلع ناممکن، Aspirationspneumonie = پیامد. Odynophagie = درد بلع، نه مانع عبور.","count":3,"stars":2,"img":null},{"n":56,"code":"BG","de":"Welche Aussagen zur Perkussion und Vibrationsbehandlung sind richtig?","fa":"کدام جمله‌ها درباره‌ی Perkussion (کوبیدن) و Vibration درست‌اند؟","ok":["Perkussion, also das Klopfen, wird kaum noch zur Sekretlösung angewandt, da es neue Techniken zur Sekretmobilisation gibt und die Effizienz nicht belegt ist.","Bei der Vibrationsbehandlung gelangt das Sekret leichter in die großen Bronchialabschnitte, wo es abgehustet oder abgesaugt werden kann.","Bei der Vibrationsbehandlung machen die Schwingungen den Schleim elastischer."],"bad":["Die Perkussion wird häufig zur Sekretlösung angewandt, da diese Behandlungsweise sehr effizient ist.","Bei der Perkussion erfolgt die Sekretlösung mithilfe von Instrumenten."],"tip":"موضوع: ضربه و ویبراسیون. روش حل: Perkussion تقریباً دیگر استفاده نمی‌شود (اثربخشی اثبات نشده)؛ Vibration ترشحات را به برونش‌های بزرگ می‌رساند و مخاط را الاستیک‌تر می‌کند.","count":3,"stars":2,"img":null},{"n":57,"code":"BH","de":"Beschrifte die Gram-negative Zellwand anhand der Nummern.","fa":"دیواره‌ی سلولی گرم‌منفی را با شماره‌ها نام‌گذاری کن.","ok":["1 = Mureinschicht (لایه‌ی مورئین)","2 = Plasmamembran (غشای پلاسمایی)","3 = Zytoplasma (سیتوپلاسم)","4 = Periplasma (فضای پری‌پلاسمی)","5 = Äußere Membran (غشای خارجی)"],"bad":[],"tip":"موضوع: دیواره‌ی سلولی گرم‌منفی. روش حل: از داخل به خارج: ۱ Mureinschicht، ۲ Plasmamembran، ۳ Zytoplasma، ۴ Periplasma، ۵ Äußere Membran (طبق کلید سایت).","count":3,"sta  را کامل کن.","ok":["Beginn: Asthma = akut","Beschwerden: Asthma = Anfälle","Obstruktion: Asthma = variabel","Reversibilität: Asthma = voll","Verlauf: Asthma = variabel"],"bad":[],"tip":"موضوع: آسم در مقابل COPD. روش حل: هر ردیف جدول را با ویژگی‌اش تطبیق بده (حاد، حمله‌ای، متغیر، کامل، متغیر).","count":2,"stars":2,"img":null},{"n":62,"code":"BE","de":"In welcher Reihenfolge erfolgen die nächsten Schritte, nachdem die betreuende Person Kontakt zu möglichen außerklinischen Versorgern aufgenommen hat?","fa":"پس از تماس با ارائه‌دهندگان مراقبت خارج از بیمارستان، مراحل بعدی به چه ترتیبی است؟","ok":["1. Der zukünftige Versorger fährt zum Kennenlernen in die Klinik oder Rehaeinrichtung zum Erstbesuch.","2. Bei Gefallen beginnt der Case Manager mit seiner Arbeit.","3. Die Formalitäten.","4. Klären der Kostenübernahme.","5. Der Patient kann verlegt werden."],"bad":[],"tip":"موضوع: ترخیص (ترتیب مراحل). روش حل: Erstbesuch Versorger، Case Manager، Formalitäten، Kostenübernahme، Verlegung.","count":2,"stars":2,"img":null},{"n":63,"code":"BL","de":"Bringe den Pflegeprozess nach der Anamnese in die richtige Reihenfolge.","fa":"فرایند پرستاری را بعد از Anamnese به ترتیب درست مرتب کن.","ok":["1. Diagnose","2. Festlegung der Ziele","3. Planung der Maßnahmen","4. Durchführen der Maßnahmen","5. Evaluation"],"bad":[],"tip":"موضوع: فرایند پرستاری. روش حل: بعد از Anamnese: Diagnose، Ziele، Planung، Durchführung، Evaluation.","count":2,"stars":2,"img":null},{"n":64,"code":"BN","de":"Welche Aussagen zu der motorischen Einheit und der dazugehörigen motorischen Endplatte sind richtig?","fa":"کدام جمله‌ها درباره‌ی واحد حرکتی و صفحه‌ی حرکتی درست‌اند؟","ok":["Durch die Anbindung der Neurotransmitter an die Rezeptoren erfolgt die Auslösung des Aktionspotenzials am Muskel.","Die Anzahl von motorischen Einheiten pro Muskel ist abhängig von der Komplexität der Bewegung, die dieser Muskel steuert."],"bad":["Die motorische Endplatte ist die Verbindungsstelle zwischen motorischer Nervenzelle und dem ZN   return o.slots.every((c,j)=>c!==null&&o.chips[c].t===o.pairs[j].r)}

/* ---------- Kopfzeile ---------- */
function head(){
  const sw=`<button class="sw" id="fa" aria-pressed="${showFa}"><i></i>ترجمه‌ی فارسی</button>`,sa=exam?`<button class="sw" id="ans" aria-pressed="${showAns}"><i></i>پاسخ درست</button>`:"";
  if(exam){const n=exam.qs.length,d=exam.qs.filter(answered).length,pct=Math.round(d/n*100);
    $("#hd").innerHTML=`<span class="ver">v${VER}</span><div class="prog"><div class="t">${pct}% vollständig <span>${exam.i+1}/${n} Schritte</span></div><div class="track"><i style="width:${(exam.i+1)/n*100}%"></i></div></div><div class="tools"><span id="timer"></span>${sa}${sw}</div>`;tick()}
  else $("#hd").innerHTML=`<span class="ver">v${VER}</span><div class="brand">Abschlusstest · Simulator</div><div class="tools">${sw}</div>`}
function tick(){const t=$("#timer");if(!t||!exam)return;const s=Math.max(0,Math.round((exam.end-Date.now())/1000));
  t.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");if(!s)finish()}

/* ---------- Startseite ---------- */
function home(){
  clearInterval(tid);exam=null;head();
  $("#app").innerHTML=`<section class="card start"><h1>Abschlusstest</h1><p>20 Fragen · 45 Minuten · bestanden ab 50 %</p>
  <p class="fa-block">سؤال‌ها بر اساس تکرارشان در ${fa(EXAMS)} امتحان واقعی انتخاب می‌شوند.</p><button class="go" id="go">Test starten</button></section>${stats()}`;
  $("#go").onclick=start}
function start(){exam={qs:pick().map(makeQ),i:0,end:Date.now()+45*60e3,warn:false};clearInterval(tid);tid=setInterval(tick,500);head();stage()}

/* ---------- Frage ---------- */
function stage(){
  const o=exam.qs[exam.i],q=o.q,last=exam.i===exam.qs.length-1;
  let h=`<article class="card ${exam.i%2?"even":"odd"}"><h2 class="qn">${exam.i+1}. Frage</h2><div class="qt">${esc(q.de)}</div><span class="fa">${esc(q.fa)}</span>${q.img?`<img class="pic" src="${q.img}" alt="">`:""}`;
  if(o.t==="mc")h+=`<div class="opts">`+o.opts.map((p,j)=>`<button type="button" class="opt ${o.ans.has(j)?"on":""} ${p.ok?"hintok":""}" data-j="${j}" role="checkbox" aria-checked="${o.ans.has(j)}"><span class="box"></span><span class="ot">${esc(p.x)}${faOf(q,p.i)}</span></button>`).join("")+`</div>`;
  if(o.t==="ord")h+=`<div class="opts" id="ord">`+o.order.map((p,k)=>`<div class="row" draggable="true" data-k="${k}"><span class="grip">✥</span><span class="ot">${esc(p.x)}${faOf(q,p.i)}</span><b class="hint" title="Richtige Position">${p.pos}</b><span class="arr"><button type="button" data-up="${k}" aria-label="nach oben">▲</button><button type="button" data-dn="${k}" aria-label="nach unten">▼</button></span></div>`).join("")+`</div>`;
  if(o.t==="map"){
    const used=new Set(o.slots.filter(s=>s!==null));
    h+=`<div class="pool" id="pool">`+o.pool.filter(id=>!used.has(id)).map(id=>o.chips[id]).map(c=>`<button type="button" class="chip ${o.sel===c.id?"sel":""}" draggable="true" data-c="${c.id}">✥ ${esc(c.t)}</button>`).join("")+`</div><div class="opts">`+
    o.pairs.map((p,j)=>`<div class="mrow"><div class="ml" dir="auto">${esc(p.l)}${faOf(q,p.i)}</div><div class="slot" tabindex="0" data-s="${j}">${o.slots[j]!==null?`<span class="chip" data-back="${j}">${esc(o.chips[o.slots[j]].t)}</span>`:""}</div><div class="hint corr">✔ ${esc(p.r)}</div></div>`).join("")+`</div>`}
  const un=exam.qs.filter(x=>!answered(x)).length;
  h+=`<div class="nav">${exam.warn&&last&&un?`<span class="warn fa-block">${fa(un)} سؤال بی‌پاسخ مانده است.</span>`:""}<button class="lnk" id="prev" ${exam.i?"":"disabled"}>Zurück</button><button class="go" id="next">${last?(exam.warn&&un?"Trotzdem abgeben":"Abgeben"):"Weiter"}</button></div></article>
  <div class="dots">${exam.qs.map((x,k)=>`<button data-g="${k}" class="${answered(x)?"done":""} ${k===exam.i?"cur":""}" aria-label="Frage ${k+1}">${k+1}</button>`).join("")}</div>`;
  $("#app").innerHTML=h;head();scrollTo(0,0)}
function patch(){const y=scrollY;stage();scrollTo(0,y)}
function place(o,slot,cid){ // Chip in Feld legen (ein Chip steht nur an einer Stelle)
  const old=o.slots.indexOf(cid);if(old>=0)o.slots[old]=null;o.slots[slot]=cid;o.sel=null}
document.addEventListener("click",e=>{
  const t=e.target;if(t.closest("#ans")){showAns=!showAns;document.body.classList.toggle("showans",showAns);t.closest("#ans").setAttribute("aria-pressed",showAns);return}
  if(t.closest("#fa")){showFa=!showFa;store.set("abs_fa",showFa);document.body.classList.toggle("showfa",showFa);t.closest("#fa").setAttribute("aria-pressed",showFa);return}
  if(t.closest("#sv")){saveFile(true).then(refreshBar);return}
  const cl=t.closest("#clr");if(cl){if(cl.dataset.s)clearStats();else{cl.dataset.s=1;cl.textContent="دوباره بزن تا همه‌ی آمار پاک شود (برای پاک شدن دائمی، بعدش «ذخیره در فایل» را بزن)"}return}
  if(!exam)return;const o=exam.qs[exam.i];let b;
  if(b=t.closest(".opt")){const j=+b.dataset.j;o.ans.has(j)?o.ans.delete(j):o.ans.add(j);patch();return}
  if(b=t.closest("[data-up]")){const k=+b.dataset.up;if(k>0){[o.order[k-1],o.order[k]]=[o.order[k],o.order[k-1]];o.touched=true;patch()}return}
  if(b=t.closest("[data-dn]")){const k=+b.dataset.dn;if(k<o.order.length-1){[o.order[k+1],o.order[k]]=[o.order[k],o.order[k+1]];o.touched=true;patch()}return}
  if(b=t.closest("#pool .chip")){const c=+b.dataset.c;o.sel=o.sel===c?null:c;patch();return}
  if(b=t.closest("[data-back]")){o.slots[+b.dataset.back]=null;patch();return}
  if(b=t.closest(".slot")){if(o.sel!==null){place(o,+b.dataset.s,o.sel);patch()}return}
  if(b=t.closest("#prev")){exam.i--;stage();return}
  if(b=t.closest("[data-g]")){exam.i=+b.dataset.g;stage();return}
  if(b=t.closest("#next")){
    if(exam.i<exam.qs.length-1){exam.i++;stage();return}
    const un=exam.qs.filter(x=>!answered(x)).length;if(un&&!exam.warn){exam.warn=true;patch();return}finish()}});
document.addEventListener("keydown",e=>{const s=e.target.closest&&e.target.closest(".slot");if(s&&exam&&(e.key==="Enter"||e.key===" ")){e.preventDefault();s.click()}});
let drag=null,lastPT="mouse";
document.addEventListener("pointerdown",e=>{lastPT=e.pointerType;if(e.pointerType==="mouse"||!exam)return;
  if(e.target.closest("button[data-up],button[data-dn]"))return;const src=e.target.closest&&e.target.closest("[data-c],[data-back],.row[data-k]");if(!src)return;
  const row=src.matches(".row[data-k]")?src:null,node=src;
  const o=exam.qs[exam.i];
  const d=row?{k:+row.dataset.k}:{c:src.dataset.c!==undefined?+src.dataset.c:o.slots[+src.dataset.back]};
  tp={d,node,x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY,id:e.pointerId,moved:false,ghost:null};
  try{src.setPointerCapture(e.pointerId)}catch(_){}},{passive:true});
let tp=null,raf=0,noclick=0;
function tpUnder(){if(!tp||!tp.ghost)return null;tp.ghost.style.display="none";const el=document.elementFromPoint(tp.x,tp.y);tp.ghost.style.display="";return el}
function tpHi(){document.querySelectorAll(".slot.over,.row.over").forEach(x=>x.classList.remove("over"));const el=tpUnder();if(!el)return;const t=el.closest(".slot")||(tp.d.k!==undefined?el.closest(".row"):null);if(t)t.classList.add("over")}
function tpScroll(){cancelAnimationFrame(raf);if(!tp||!tp.moved)return;const h=innerHeight,m=70;let v=0;if(tp.y<m)v=-Math.ceil((m-tp.y)/6);else if(tp.y>h-m)v=Math.ceil((tp.y-(h-m))/6);
  if(v){scrollBy(0,v);tpHi()}raf=requestAnimationFrame(tpScroll)}
document.addEventListener("pointermove",e=>{if(!tp||e.pointerId!==tp.id)return;tp.x=e.clientX;tp.y=e.clientY;
  if(!tp.moved&&Math.abs(e.clientX-tp.x0)+Math.abs(e.clientY-tp.y0)<8)return;
  if(!tp.moved){tp.moved=true;const r=tp.node.getBoundingClientRect(),g=tp.node.cloneNode(true);g.className+=" ghost";g.style.cssText=`position:fixed;z-index:99;pointer-events:none;width:${r.width}px;left:0;top:0;opacity:.92;box-shadow:0 8px 24px rgba(0,0,0,.45)`;document.body.appendChild(g);tp.ghost=g;tp.node.style.opacity=".35";tpScroll()}
  tp.ghost.style.transform=`translate(${tp.x-tp.ghost.offsetWidth/2}px,${tp.y-tp.ghost.offsetHeight/2}px)`;tpHi();e.preventDefault()});
function tpEnd(ok){if(!tp)return;cancelAnimationFrame(raf);const t=tp;tp=null;
  if(!t.moved)return;const el=ok?(t.ghost.style.display="none",document.elementFromPoint(t.x,t.y)):null;t.ghost.remove();t.node.style.opacity="";
  document.querySelectorAll(".slot.over,.row.over").forEach(x=>x.classList.remove("over"));noclick=Date.now();
  if(ok&&exam){drag=t.d;applyDrop(el)}}
document.addEventListener("pointerup",e=>{if(tp&&e.pointerId===tp.id)tpEnd(true)});
document.addEventListener("pointercancel",e=>{if(tp&&e.pointerId===tp.id)tpEnd(false)});
document.addEventListener("click",e=>{if(Date.now()-noclick<400){e.stopPropagation();e.preventDefault()}},true);
document.addEventListener("dragstart",e=>{if(lastPT!=="mouse"){e.preventDefault();return}const c=e.target.closest&&e.target.closest("[data-c],[data-back],[data-k]");if(!c||!exam)return;
  drag=c.dataset.c!==undefined?{c:+c.dataset.c}:c.dataset.back!==undefined?{c:exam.qs[exam.i].slots[+c.dataset.back]}:{k:+c.dataset.k};e.dataTransfer.setData("text/plain","x");e.dataTransfer.effectAllowed="move"});
document.addEventListener("dragover",e=>{if(drag&&e.target.closest&&e.target.closest(".slot,#pool,.row")){e.preventDefault();const s=e.target.closest(".slot");document.querySelectorAll(".slot.over").forEach(x=>x.classList.remove("over"));if(s)s.classList.add("over")}});
function applyDrop(t){const o=exam.qs[exam.i];
  const s=t&&t.closest(".slot"),r=t&&t.closest(".row"),p=t&&t.closest("#pool");
  if(drag.c!==undefined&&drag.c!==null){if(s)place(o,+s.dataset.s,drag.c);else if(p){const old=o.slots.indexOf(drag.c);if(old>=0)o.slots[old]=null}}
  if(drag.k!==undefined&&r){const to=+r.dataset.k,[m]=o.order.splice(drag.k,1);o.order.splice(to,0,m);o.touched=true}
  drag=null;patch()}
document.addEventListener("drop",e=>{if(!drag||!exam)return;e.preventDefault();applyDrop(e.target)});
document.addEventListener("dragend",()=>{drag=null;document.querySelectorAll(".slot.over").forEach(x=>x.classList.remove("over"))});

/* ---------- Ergebnis ---------- */
function review(o,k){
  const q=o.q,ok=grade(o);let h=`<article class="card ${k%2?"even":"odd"}"><span class="tag ${ok?"y":"n"}">${ok?"✔ Richtig":"✘ Falsch"}</span><h2 class="qn">${k+1}. Frage</h2><div class="qt">${esc(q.de)}</div><span class="fa">${esc(q.fa)}</span>${q.img?`<img class="pic" src="${q.img}" alt="">`:""}<div class="opts">`;
  if(o.t==="mc")h+=o.opts.map((p,j)=>`<div class="opt ${p.ok?"okm":o.ans.has(j)?"badm":""}"><span class="box" style="${o.ans.has(j)?"background:var(--accent);border-color:var(--accent)":""}"></span><span class="ot">${esc(p.x)}${faOf(q,p.i)}</span></div>`).join("");
  if(o.t==="ord")h+=o.order.map((p,k2)=>`<div class="row ${p.pos===k2+1?"okm":"badm"}"><span class="ot">${esc(p.x)}${faOf(q,p.i)}</span><b>${p.pos===k2+1?"✔":"→ "+p.pos}</b></div>`).join("");
  if(o.t==="map")h+=o.pairs.map((p,j)=>{const c=o.slots[j],good=c!==null&&o.chips[c].t===p.r;return`<div class="mrow ${good?"okm":"badm"}"><div class="ml" dir="auto">${esc(p.l)}${faOf(q,p.i)}</div><div class="slot">${c!==null?esc(o.chips[c].t):"–"}</div>${good?"":`<div class="corr">✔ ${esc(p.r)}</div>`}</div>`}).join("");
  return h+`</div></article>`}
function finish(){
  clearInterval(tid);if(!exam)return;const E=exam;exam=null;
  const right=E.qs.filter(grade).length,pct=Math.round(right/E.qs.length*100);
  const prev=HIST.length?HIST[HIST.length-1].pct:null;
  HIST.push({d:Date.now(),r:right,pct,sec:Math.round((Date.now()-(E.end-45*60e3))/1000)});store.set("abs_hist",HIST);dirty=true;if(fh)saveFile(true).then(refreshBar);head();
  $("#app").innerHTML=`<section class="card res fa-block"><div class="big ${pct>=50?"p":"f"}">${fa(pct)}٪</div><p>${fa(right)} از ۲۰ درست · ${pct>=50?"قبول":"مردود"}${prev!==null?` · نسبت به آزمون قبل ${pct-prev>=0?"+":"−"}${fa(Math.abs(pct-prev))} درصد`:""}</p>
  <p style="direction:ltr;margin:0"><button class="go" id="again">Neuer Test</button> <button class="lnk" id="hm">Statistik</button></p></section>${stats()}<div class="rev">${E.qs.map(review).join("")}</div>`;
  $("#again").onclick=start;$("#hm").onclick=home;scrollTo(0,0);}

/* ---------- Statistik ---------- */
function stats(){
  const h=HIST;if(!h.length)return`<section class="card fa-block" style="margin-top:16px">هنوز آزمونی ثبت نشده است.</section>`;
  const p=h.map(x=>x.pct),avg=Math.round(p.reduce((a,b)=>a+b,0)/p.length),last=p[p.length-1];
  const prevAvg=p.length>1?Math.round(p.slice(0,-1).reduce((a,b)=>a+b,0)/(p.length-1)):null;
  const sg=v=>(v>=0?"+":"−")+fa(Math.abs(v))+" درصد";
  return`<section class="card fa-block" style="margin-top:16px"><h3>آمار پیشرفت</h3><div class="savebar">${barInner()}</div><table>
  <tr><td>تعداد آزمون‌ها</td><td>${fa(p.length)}</td></tr><tr><td>نمره‌ی آخر</td><td>${fa(last)}٪</td></tr>
  <tr><td>پیشرفت نسبت به آزمون قبل</td><td>${p.length>1?sg(last-p[p.length-2]):"—"}</td></tr>
  <tr><td>پیشرفت نسبت به میانگین قبلی‌ها</td><td>${prevAvg!==null?sg(last-prevAvg):"—"}</td></tr>
  <tr><td>میانگین</td><td>${fa(avg)}٪</td></tr><tr><td>بهترین نمره</td><td>${fa(Math.max(...p))}٪</td></tr>
  <tr><td>تعداد قبولی</td><td>${fa(p.filter(x=>x>=50).length)} از ${fa(p.length)}</td></tr></table>${chart(p)}
  <div class="scroll"><table><tr><th>ردیف</th><th>تاریخ</th><th>درست</th><th>نمره</th></tr>${h.slice().reverse().map((x,i)=>`<tr><td>${fa(h.length-i)}</td><td>${new Date(x.d).toLocaleString("fa-IR")}</td><td>${fa(x.r)}</td><td>${fa(x.pct)}٪</td></tr>`).join("")}</table></div>
  <button class="lnk" id="clr">پاک کردن آمار</button></section>`}
function chart(p){const W=640,H=240,L=38,B=26,n=p.length,xs=i=>L+(n<2?(W-L-12)/2:i*(W-L-12)/(n-1)),ys=v=>10+(H-B-10)*(1-v/100);
  let g=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="نمودار پیشرفت نمره‌ها">`;
  for(const v of[0,25,50,75,100])g+=`<line x1="${L}" x2="${W-12}" y1="${ys(v)}" y2="${ys(v)}" stroke="currentColor" opacity=".18"/><text x="${L-6}" y="${ys(v)+4}" font-size="11" text-anchor="end" fill="currentColor">${v}%</text>`;
  g+=`<line x1="${L}" x2="${W-12}" y1="${ys(50)}" y2="${ys(50)}" stroke="var(--bad)" stroke-dasharray="5 4" opacity=".8"/>`;
  g+=`<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" points="${p.map((v,i)=>xs(i)+","+ys(v)).join(" ")}"/>`;
  g+=p.map((v,i)=>`<circle cx="${xs(i)}" cy="${ys(v)}" r="4.5" fill="${v>=50?"var(--ok)":"var(--bad)"}"><title>${i+1}: ${v}%</title></circle>`).join("");
  g+=p.map((v,i)=>n<=20||i%Math.ceil(n/20)===0?`<text x="${xs(i)}" y="${H-8}" font-size="11" text-anchor="middle" fill="currentColor">${i+1}</text>`:"").join("");
  return g+`</svg>`}
home();
</script>

</body></html>
