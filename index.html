const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(D.s),iterations:D.n,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
const t=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(D.i)},k,b(D.d));return new TextDecoder().decode(t)}
function show(h){document.open();document.write(h);document.close()}
const K="atena_pw";
async function go(pw,rem){const m=document.getElementById("m");m.textContent="در حال بررسی…";
try{const h=await open_(pw);if(rem){try{localStorage.setItem(K,pw)}catch(e){}}show(h)}catch(e){m.textContent="رمز درست نیست.";try{localStorage.removeItem(K)}catch(e){}}}
document.getElementById("f").onsubmit=e=>{e.preventDefault();go(document.getElementById("p").value,document.getElementById("r").checked)};
try{const s=localStorage.getItem(K);if(s)go(s,true)}catch(e){}
